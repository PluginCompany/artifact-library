<!doctype html>
<!--
  EDITING GUIDE — ref-feature-tour
  ================================
  A guided tour of a software product: real screenshots with numbered callouts, paths per
  role, chapters in workflow order, and a player that watches (camera, captions) or explores
  (full text, question thread) one feature at a time. Here the product is Artifact Library.

  What lives where
    data.js           ALL content: hero, roles, chapters and their slides, diagram labels,
                      "under the hood" notes.
    shots/            Screenshots (webp, 2× pixel density) and manifest.js with each shot's
                      size and its named targets: pins (callout positions) and rects (what
                      the camera zooms to). Generated by capture.py — never edit by hand.
    capture.py        Regenerates shots/ from a running server (Playwright). The shot list
                      is at the bottom: a page, a few actions, and named targets (selectors).
    app.js            Landing (reel, marquee, paths, gallery) and the player. Rarely touched.
    style.css         Styles for this page; colours and type come from the kit.
    kit/              Shared design system, copied in by ../publish.sh. Never edit here.

  Slides (in TOUR.chapters[i].slides)
    feature  { title, lead, shot, points: [[text, target], …], how?: [..], why? }
             target is a name from that shot's targets; it gets a numbered pin and the
             camera zooms to it while watching. Use null for a point without a pin.
    steps    { title, lead, steps: [{ text, shot, pin }], why? }  several shots in order
    compare  { title, lead, before: { shot, label }, after: { shot, label }, points, why? }
    concept  { title, lead, diagram: "loop" | "store", points: [[text, null], …], why? }
    roles    a slide (or chapter) lists the roles it matters to; paths play only those.

  Common changes
    • New screenshot   → add a shot to capture.py, run it, reference it in data.js.
    • New chapter      → push { id, title, roles, thumb, intro, learn, slides } in order.
    • Highlights       → TOUR.highlights lists slide ids (<chapter id>-<position>).
  Links and feedback
    #<slide id> opens that slide in Explore mode. Each chapter has a question thread
    saved as comments.chapter-<id>; agents read it with `artifact feedback <slug>`.
  Don't
    • Hard-code colours: use kit tokens (var(--accent), var(--thread)…).
    • Show invented screens: every picture should come from capture.py.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A guided tour of Artifact Library</title>
<meta name="description" content="Feature tour of Artifact Library with real screenshots: the library, versions, answering on the page, live pages, the reference collection, agents and running the server, with paths per role.">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="style.css">
<script src="kit/kit.js" defer></script>
<script src="kit/kit-data.js" defer></script>
<script src="shots/manifest.js" defer></script>
<script src="data.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main id="landing">
  <header class="hero" id="top">
    <div class="wrap tour-bar">
      <span data-save-status></span>
      <a class="icon-btn" href="/artifacts/reference-collection/" title="All reference artifacts">Collection</a>
      <button class="icon-btn" type="button" data-theme-toggle></button>
    </div>
    <div class="wrap">
      <section class="tour-hero">
        <div>
          <div class="eyebrow rise" id="hero-eyebrow"></div>
          <h1 class="rise" style="--i:1" id="hero-title"></h1>
          <p class="lead rise" style="--i:2" id="hero-lead"></p>
          <div class="hero-actions rise" style="--i:3">
            <button class="btn cta" type="button" id="watch-hl"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span id="hl-label"></span></button>
            <button class="btn glass" type="button" id="watch-all"></button>
            <button class="btn ghost" type="button" id="browse" data-t="browse"></button>
          </div>
          <p class="kbd note rise" style="--i:4" id="hero-length"></p>
          <div class="hero-stats rise" style="--i:5" id="hero-stats"></div>
        </div>
        <div class="reel rise" style="--i:2">
          <button class="reel-frame" type="button" id="reel" data-t-aria="reelAria">
            <span class="reel-bar"><i></i><i></i><i></i><b id="reel-n"></b><span id="reel-title"></span></span>
            <span class="reel-view" id="reel-view"></span>
            <span class="reel-play"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span data-t="playChapter"></span></span>
          </button>
          <figure class="reel-float" id="reel-float" aria-hidden="true"></figure>
          <div class="pips" id="pips"></div>
        </div>
      </section>
    </div>
    <div class="marquee" id="marquee"></div>
  </header>

  <div class="wrap section">
    <div class="section-head"><div><h2 data-t="pathTitle"></h2><p data-t="pathText"></p></div></div>
    <div class="roles" id="roles"></div>
  </div>

  <div class="wrap section" id="features">
    <div class="section-head"><div><h2 data-t="galleryTitle"></h2><p data-t="galleryText"></p></div></div>
    <div class="g-bar">
      <div class="index-tools">
        <label class="sr-only" for="q" data-t="searchLabel"></label>
        <input class="search" id="q" type="search" data-t-ph="searchHint" autocomplete="off">
        <div class="chips" role="group" data-t-aria="filterAria" id="index-chips"></div>
      </div>
      <nav class="g-nav" id="g-nav" data-t-aria="chapters"></nav>
    </div>
    <div id="gallery"></div>
  </div>

  <div class="wrap section">
    <div class="behind">
      <div><div class="eyebrow" data-t="behindEyebrow"></div><h2 style="font-size:26px;margin-top:6px" data-t="behindTitle"></h2><p style="color:var(--muted);margin-top:8px" data-t="behindText"></p></div>
      <ul id="behind"></ul>
    </div>
    <p class="foot-note" id="captured"></p>
  </div>
</main>

<div class="player" id="player" hidden role="dialog" aria-modal="true" data-t-aria="tourAria">
  <div class="p-top">
    <div class="where"><span class="eyebrow" id="p-kicker"></span><b id="p-chapter"></b></div>
    <span class="p-loading" id="p-loading" hidden data-t="loading"></span>
    <button class="icon-btn hide-narrow" type="button" id="p-menu-btn" aria-expanded="false" aria-controls="p-menu"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span data-t="chapters"></span></button>
    <button class="icon-btn" type="button" id="p-close" data-t-aria="closeAria"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <div class="progress" id="p-progress"></div>
  <div class="stage" id="p-stage">
    <div class="visual" id="p-visual"></div>
    <div class="p-panel" id="p-panel"></div>
    <div class="cap" id="p-cap" aria-live="polite"></div>
  </div>
  <div class="p-bottom">
    <button class="icon-btn" type="button" id="p-prev" data-t-aria="prev"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4L6 9l5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon-btn play" type="button" id="p-play" data-t-aria="play"></button>
    <button class="icon-btn" type="button" id="p-next" data-t-aria="next"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="time" id="p-time"></span>
    <span class="spacer"></span>
    <span class="kbd hide-narrow">Space · ← → · Esc</span>
    <button class="icon-btn" type="button" id="p-speed" data-t-aria="speedAria">2×</button>
    <div class="mode" role="group" data-t-aria="modeAria">
      <button type="button" data-mode="watch" aria-pressed="true" data-t="watch"></button>
      <button type="button" data-mode="explore" aria-pressed="false" data-t="explore"></button>
    </div>
    <button class="icon-btn hide-narrow" type="button" id="p-full" data-t-aria="fullAria"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7V3h4M15 7V3h-4M3 11v4h4M15 11v4h-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
  </div>
  <div class="menu" id="p-menu" hidden></div>
</div>

<div class="zoom" id="zoom" hidden tabindex="-1" role="dialog" data-t-aria="zoomAria"></div>
</body>
</html>
